task: 'retriever'

env:
  num_threads: 16
  seed: 42
  deterministic: true

dataset:
  name: 'webqsp'
  text_encoder_name: 'bge-m3-v1'

retriever:
  topic_pe: true
  relation_topic_source: 'bge'
  relation_topic_bge_format: 'split'
  relation_score_mode: 'hybrid'
  relation_score_alpha: 0.5
  relation_score_calibration: 'platt'
  relation_topic_mask_mode: 'cluster'
  cluster_ratio: 0.90
  cluster_min_k: 2
  cluster_max_k: 15
  use_relation_topic_mask: true
  topk_rt: 5
  dde_mode: 'both'
  weighted_dde_floor: 0.1
  DDE_kwargs:
    num_rounds: 2
    num_reverse_rounds: 2

optimizer:
  lr: 1e-3

eval:
  k_list: '50,100,200,500'

train:
  num_epochs: 10000
  patience: 10
  save_prefix: 'webqsp_rt_combined_calibrated_cluster'
