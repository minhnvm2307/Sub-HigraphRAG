task: 'retriever'

env:
  num_threads: 16
  seed: 42

dataset:
  name: 'webqsp'
  text_encoder_name: 'gte-large-en-v1.5'

retriever:
  topic_pe: true
  relation_topic_source: 'gte'
  relation_score_mode: 'hybrid'
  relation_score_alpha: 0.5
  use_relation_topic_mask: true
  topk_rt: 5
  dde_mode: 'baseline'
  DDE_kwargs:
    num_rounds: 2
    num_reverse_rounds: 2

optimizer:
  lr: 1e-3

eval:
  k_list: '100'

train:
  num_epochs: 10000
  patience: 10
  save_prefix: 'webqsp_rt_mlp'
