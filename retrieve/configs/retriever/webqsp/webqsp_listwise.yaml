task: 'retriever'

env:
  num_threads: 16
  seed: 42
  deterministic: true

dataset:
  name: 'webqsp'
  text_encoder_name: 'gte-large-en-v1.5'

retriever:
  topic_pe: true
  use_relation_topics_mlp: false
  use_relation_topics_dde: false
  use_only_weighted_dde: false
  DDE_kwargs:
    num_rounds: 2
    num_reverse_rounds: 2
  listwise:
    # This is consumed only by two-stage-train.py / two-stage-inference.py.
    enabled: true
    top_n: 500
    num_heads: 4
    num_layers: 2
    d_model: 256
    dim_feedforward: 1024
    dropout: 0.1
    rank_margin: 0.0001

loss:
  # Pure ranking loss: it is invariant to a query-wide score shift and focuses
  # the listwise residual on moving positives above hard top-ranked negatives.
  type: 'margin'
  pos_weight_mode: 'none'
  pos_weight: null
  margin: 0.2
  negative_mining: 'hard'
  num_negatives: 20

optimizer:
  lr: 1e-3

eval:
  k_list: '50,100,400,500'

train:
  num_epochs: 10000
  patience: 50
  save_prefix: 'webqsp_two_stage_listwise_margin_hard'
