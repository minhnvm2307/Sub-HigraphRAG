task: 'retriever'

env:
  num_threads: 16
  seed: 42
  deterministic: true

dataset:
  name: 'webqsp'
  text_encoder_name: 'gte-large-en-v1.5'

retriever:
  topic_pe: true
  use_relation_topics_mlp: false
  use_relation_topics_dde: false
  use_only_weighted_dde: false
  DDE_kwargs:
    num_rounds: 2
    num_reverse_rounds: 2
  listwise:
    enabled: true
    top_n: 500
    num_heads: 4
    num_layers: 2
    d_model: 256
    dim_feedforward: 1024
    dropout: 0.1
    rank_margin: 0.0001

loss:
  # Effective-number BCE balances sparse labels; hard margin keeps the stage-2
  # objective focused on positives crossing high-ranked negatives.
  type: 'hybrid'
  pos_weight_mode: 'effective_num'
  beta: 0.999
  focal_gamma: 0.0
  margin: 0.2
  negative_mining: 'hard'
  num_negatives: 20
  ranking_weight: 1.0
  cls_weight: 0.25

optimizer:
  lr: 1e-3

eval:
  k_list: '50,100,400,500'

train:
  num_epochs: 10000
  patience: 50
  save_prefix: 'webqsp_two_stage_listwise_effective_hybrid'
