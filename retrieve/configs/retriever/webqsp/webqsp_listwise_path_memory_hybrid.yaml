task: 'retriever'

env:
  num_threads: 16
  seed: 42
  deterministic: true

dataset:
  name: 'webqsp'
  text_encoder_name: 'bge-m3-v1'

retriever:
  topic_pe: true
  relation_topic_source: 'path_memory_hybrid'
  relation_score_mode: 'hybrid'
  use_relation_topic_mask: true
  topk_rt: 5
  dde_mode: 'both'
  DDE_kwargs:
    num_rounds: 2
    num_reverse_rounds: 2
  listwise:
    # Consumed by two-stage-train.py / two-stage-inference.py
    enabled: true
    top_n: 500
    num_heads: 4
    num_layers: 2
    d_model: 256
    dim_feedforward: 1024
    dropout: 0.1
    rank_margin: 0.0001
    selection_metric: 'ans_recall@100'

loss:
  # Authentic listwise ranking loss from webqsp_listwise.yaml:
  # Invariant to query-wide score shift and focuses listwise residual on moving
  # positives above hard top-ranked negatives.
  type: 'margin'
  pos_weight_mode: 'none'
  pos_weight: null
  margin: 0.2
  negative_mining: 'hard'
  num_negatives: 20

optimizer:
  lr: 1e-3

eval:
  k_list: '50,100,200,400,500'

train:
  num_epochs: 10000
  patience: 50
  save_prefix: 'webqsp_two_stage_listwise_path_memory_hybrid'
